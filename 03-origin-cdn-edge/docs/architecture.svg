<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Caveat, 'Comic Sans MS', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');</style>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="1100" height="620" fill="#fffdf8"/>
  <text x="550" y="44" text-anchor="middle" font-size="34" font-weight="700" fill="#2b2b2b">Origin + mini CDN edge</text>

  <g filter="url(#wobble)" stroke="#3a3a3a" stroke-width="2.2">
    <rect x="40" y="110" width="210" height="110" rx="14" fill="#d8ecff"/>
    <rect x="40" y="300" width="210" height="110" rx="14" fill="#e6dcff"/>
    <rect x="330" y="300" width="190" height="110" rx="14" fill="#f1f1f1"/>
    <rect x="600" y="90" width="270" height="480" rx="18" fill="#dff5e3"/>
    <rect x="625" y="160" width="220" height="70" rx="10" fill="#ffffff"/>
    <rect x="625" y="250" width="220" height="70" rx="10" fill="#ffffff"/>
    <rect x="625" y="340" width="220" height="70" rx="10" fill="#ffffff"/>
    <rect x="625" y="430" width="220" height="110" rx="10" fill="#ffffff"/>
    <rect x="930" y="250" width="150" height="160" rx="14" fill="#ffe3d1"/>
  </g>

  <g fill="#2b2b2b" text-anchor="middle">
    <text x="145" y="150" font-size="27" font-weight="700">k6 load</text>
    <text x="145" y="180" font-size="21">zipf keys, 50 VUs</text>
    <text x="145" y="204" font-size="21">reads X-Cache</text>

    <text x="145" y="340" font-size="27" font-weight="700">React UI</text>
    <text x="145" y="370" font-size="21">polls metrics 1s</text>
    <text x="145" y="394" font-size="21">probe bursts</text>

    <text x="425" y="340" font-size="25" font-weight="700">Vite proxy</text>
    <text x="425" y="370" font-size="21">/edge  /origin</text>
    <text x="425" y="394" font-size="21">dev server</text>

    <text x="735" y="125" font-size="29" font-weight="700">Edge (Rust)</text>
    <text x="735" y="150" font-size="20">GET /seg/:key  /metrics  /probe</text>
    <text x="735" y="190" font-size="23" font-weight="700">LruCache : Cache</text>
    <text x="735" y="215" font-size="19">byte-size bounded</text>
    <text x="735" y="280" font-size="23" font-weight="700">Freshness check</text>
    <text x="735" y="305" font-size="19">fresh=HIT  swr=STALE</text>
    <text x="735" y="370" font-size="23" font-weight="700">Coalescer</text>
    <text x="735" y="395" font-size="19">one OnceCell per key</text>
    <text x="735" y="460" font-size="23" font-weight="700">Metrics</text>
    <text x="735" y="486" font-size="19">hits misses stale coalesced</text>
    <text x="735" y="510" font-size="19">origin fetches  hit ratio</text>

    <text x="1005" y="295" font-size="27" font-weight="700">Origin</text>
    <text x="1005" y="325" font-size="19">80 ms latency</text>
    <text x="1005" y="350" font-size="19">Cache-Control</text>
    <text x="1005" y="375" font-size="19">counts requests</text>
  </g>

  <g stroke="#3a3a3a" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M250 165 C 400 160, 480 175, 596 190"/>
    <path d="M250 355 L 326 355"/>
    <path d="M520 345 C 560 330, 575 300, 596 290"/>
    <path d="M845 375 C 880 370, 900 350, 926 340"/>
    <path d="M926 300 C 895 300, 870 285, 850 285" stroke-dasharray="7 6"/>
  </g>
  <g fill="#555" font-size="19" text-anchor="middle">
    <text x="420" y="152">GET /seg/seg-00042.ts</text>
    <text x="1005" y="440">1 fetch per key</text>
    <text x="1005" y="235">SWR refresh</text>
  </g>
</svg>
