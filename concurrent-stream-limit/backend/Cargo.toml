[package]
name = "streamlimit"
version = "0.1.0"
edition = "2024"

[lib]
name = "streamlimit"
path = "src/lib.rs"

[[bin]]
name = "streamlimit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
redis = { version = "1.7", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
