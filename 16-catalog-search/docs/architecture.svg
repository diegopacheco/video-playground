<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #222; }
      .t { font-size: 24px; font-weight: 700; }
      .s { font-size: 18px; }
      .box { stroke: #333; stroke-width: 2; filter: url(#wobble); }
      .line { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="560" fill="#fffdf8"/>

  <rect class="box" x="30" y="40" width="220" height="110" rx="14" fill="#dbeafe"/>
  <text class="t" x="50" y="78">React UI :5116</text>
  <text class="s" x="50" y="106">search-as-you-type</text>
  <text class="s" x="50" y="130">highlights + score bars</text>

  <rect class="box" x="320" y="40" width="220" height="110" rx="14" fill="#e9d5ff"/>
  <text class="t" x="340" y="78">axum API :8116</text>
  <text class="s" x="340" y="106">/api/search /api/suggest</text>
  <text class="s" x="340" y="130">/api/stats</text>

  <rect class="box" x="610" y="40" width="250" height="110" rx="14" fill="#fde68a"/>
  <text class="t" x="630" y="78">Normalizer</text>
  <text class="s" x="630" y="106">NFKC, lowercase, no accents</text>
  <text class="s" x="630" y="130">ou/oo/ō to o, kata to hira</text>

  <rect class="box" x="610" y="220" width="250" height="110" rx="14" fill="#bbf7d0"/>
  <text class="t" x="630" y="258">Query n-grams</text>
  <text class="s" x="630" y="286">latin: ^tri gram$ (open prefix)</text>
  <text class="s" x="630" y="310">CJK: unigram + bigram</text>

  <rect class="box" x="320" y="220" width="220" height="110" rx="14" fill="#fecaca"/>
  <text class="t" x="340" y="258">Indexer: NgramIndex</text>
  <text class="s" x="340" y="286">gram to postings</text>
  <text class="s" x="340" y="310">overlap = hits / grams</text>

  <rect class="box" x="30" y="220" width="220" height="110" rx="14" fill="#c7f9f1"/>
  <text class="t" x="50" y="258">Ranker: Weighted</text>
  <text class="s" x="50" y="286">Damerau-Levenshtein</text>
  <text class="s" x="50" y="310">boost + coverage + popularity</text>

  <rect class="box" x="320" y="420" width="220" height="100" rx="14" fill="#fbcfe8"/>
  <text class="t" x="340" y="458">catalog.json</text>
  <text class="s" x="340" y="486">210 titles, 3 languages</text>

  <rect class="box" x="30" y="420" width="220" height="100" rx="14" fill="#e5e7eb"/>
  <text class="t" x="50" y="458">Hits</text>
  <text class="s" x="50" y="486">breakdown + segments</text>

  <path class="line" d="M250,95 L318,95"/>
  <path class="line" d="M540,95 L608,95"/>
  <path class="line" d="M735,150 L735,218"/>
  <path class="line" d="M610,275 L542,275"/>
  <path class="line" d="M320,275 L252,275"/>
  <path class="line" d="M430,420 L430,332"/>
  <path class="line" d="M140,330 L140,418"/>
  <path class="line" d="M30,470 C 8,470 8,95 28,95"/>

  <text class="s" x="560" y="400">prepared once at startup</text>
  <text class="s" x="560" y="424">tokens keep original char positions</text>
</svg>
