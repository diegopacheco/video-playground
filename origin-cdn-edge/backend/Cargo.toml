[package]
name = "cdn"
version = "0.1.0"
edition = "2024"

[lib]
name = "cdn"
path = "src/lib.rs"

[[bin]]
name = "origin"
path = "src/bin/origin.rs"

[[bin]]
name = "edge"
path = "src/bin/edge.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }
