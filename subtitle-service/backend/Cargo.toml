[package]
name = "subtitle-service"
version = "0.1.0"
edition = "2024"

[lib]
name = "subtitle_service"
path = "src/lib.rs"

[[bin]]
name = "subtitle-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
