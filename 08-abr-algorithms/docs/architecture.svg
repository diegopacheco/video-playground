<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 470" width="1220" height="470">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #1f2937; }
      .title { font-size: 26px; font-weight: 700; }
      .sub { font-size: 18px; }
      .edge { font-size: 18px; fill: #4b5563; }
      .box { stroke: #374151; stroke-width: 2.2; }
      .line { stroke: #374151; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1220" height="470" fill="#ffffff"/>
  <g filter="url(#wobble)">
    <rect class="box" x="40" y="60" width="240" height="100" rx="14" fill="#dbeafe"/>
    <rect class="box" x="340" y="60" width="240" height="100" rx="14" fill="#fde68a"/>
    <rect class="box" x="640" y="60" width="240" height="100" rx="14" fill="#e9d5ff"/>
    <rect class="box" x="940" y="60" width="240" height="100" rx="14" fill="#fecaca"/>
    <rect class="box" x="340" y="300" width="240" height="110" rx="14" fill="#bbf7d0"/>
    <rect class="box" x="640" y="300" width="240" height="110" rx="14" fill="#fed7aa"/>
    <rect class="box" x="940" y="300" width="240" height="110" rx="14" fill="#e5e7eb"/>
    <path class="line" d="M282,110 L336,110" marker-end="url(#arrow)"/>
    <path class="line" d="M582,110 L636,110" marker-end="url(#arrow)"/>
    <path class="line" d="M882,110 L936,110" marker-end="url(#arrow)"/>
    <path class="line" d="M760,162 L760,296" marker-end="url(#arrow)"/>
    <path class="line" d="M1000,162 L860,296" marker-end="url(#arrow)"/>
    <path class="line" d="M938,378 L884,378" marker-end="url(#arrow)"/>
    <path class="line" d="M638,355 L584,355" marker-end="url(#arrow)"/>
    <path class="line" d="M460,298 L460,164" marker-end="url(#arrow)"/>
  </g>
  <text class="title" x="160" y="102" text-anchor="middle">React UI</text>
  <text class="sub" x="160" y="130" text-anchor="middle">SVG charts + table</text>
  <text class="title" x="460" y="102" text-anchor="middle">axum API</text>
  <text class="sub" x="460" y="130" text-anchor="middle">POST /api/simulate</text>
  <text class="title" x="760" y="102" text-anchor="middle">report::run</text>
  <text class="sub" x="760" y="130" text-anchor="middle">one run per algorithm</text>
  <text class="title" x="1060" y="102" text-anchor="middle">AbrAlgorithm</text>
  <text class="sub" x="1060" y="130" text-anchor="middle">Throughput | BOLA | Dynamic</text>
  <text class="title" x="460" y="342" text-anchor="middle">Metrics</text>
  <text class="sub" x="460" y="370" text-anchor="middle">bitrate, switches, stalls</text>
  <text class="sub" x="460" y="392" text-anchor="middle">startup, QoE</text>
  <text class="title" x="760" y="342" text-anchor="middle">Player model</text>
  <text class="sub" x="760" y="370" text-anchor="middle">buffer, startup, rebuffer</text>
  <text class="sub" x="760" y="392" text-anchor="middle">30s cap, 4s segments</text>
  <text class="title" x="1060" y="342" text-anchor="middle">Traces</text>
  <text class="sub" x="1060" y="370" text-anchor="middle">3G, 4G, WiFi, drop-outs</text>
  <text class="sub" x="1060" y="392" text-anchor="middle">1s kbps CSV, looped</text>
  <text class="edge" x="309" y="96" text-anchor="middle">fetch</text>
  <text class="edge" x="609" y="96" text-anchor="middle">trace</text>
  <text class="edge" x="909" y="96" text-anchor="middle">build</text>
  <text class="edge" x="700" y="235" text-anchor="middle">simulate</text>
  <text class="edge" x="985" y="235" text-anchor="start">choose(Decision)</text>
  <text class="edge" x="911" y="364" text-anchor="middle">kbps</text>
  <text class="edge" x="611" y="343" text-anchor="middle">Session</text>
  <text class="edge" x="400" y="235" text-anchor="middle">JSON report</text>
  <text class="title" x="610" y="36" text-anchor="middle">ABR simulator flow</text>
</svg>
