[package]
name = "abr"
version = "0.1.0"
edition = "2024"

[lib]
name = "abr"
path = "src/lib.rs"

[[bin]]
name = "abr-server"
path = "src/main.rs"

[[bin]]
name = "abr-report"
path = "src/bin/report.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
