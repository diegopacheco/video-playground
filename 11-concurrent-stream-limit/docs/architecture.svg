<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #2b2b2b; }
      .t { font-size: 24px; font-weight: 700; }
      .s { font-size: 18px; }
      .e { font-size: 17px; fill: #444; }
      .box { stroke: #3a3a3a; stroke-width: 2; }
      .line { stroke: #3a3a3a; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="600" fill="#fffdf8"/>
  <g filter="url(#wobble)">
    <rect class="box" x="30" y="40" width="250" height="150" rx="14" fill="#dbeafe"/>
    <rect class="box" x="380" y="40" width="250" height="150" rx="14" fill="#fde2e4"/>
    <rect class="box" x="720" y="40" width="250" height="150" rx="14" fill="#e9d5ff"/>
    <rect class="box" x="380" y="250" width="250" height="120" rx="14" fill="#fef3c7"/>
    <rect class="box" x="140" y="430" width="300" height="140" rx="14" fill="#d1fae5"/>
    <rect class="box" x="560" y="430" width="250" height="140" rx="14" fill="#e0f2fe"/>
    <rect class="box" x="720" y="250" width="250" height="120" rx="14" fill="#fee2e2"/>
    <path class="line" d="M280 115 L378 115" marker-end="url(#arrow)"/>
    <path class="line" d="M630 265 L718 185" marker-end="url(#arrow)"/>
    <path class="line" d="M505 190 L505 248" marker-end="url(#arrow)"/>
    <path class="line" d="M450 370 L320 428" marker-end="url(#arrow)"/>
    <path class="line" d="M560 370 L660 428" marker-end="url(#arrow)"/>
    <path class="line" d="M630 300 L718 300" marker-end="url(#arrow)"/>
  </g>
  <text class="t" x="50" y="75">React UI (5 devices)</text>
  <text class="s" x="50" y="105">Start: acquire</text>
  <text class="s" x="50" y="130">heartbeat every ttl/3</text>
  <text class="s" x="50" y="155">Stop: release, Crash: go silent</text>
  <text class="s" x="50" y="180">lease table polls every 500ms</text>

  <text class="t" x="400" y="75">axum HTTP :8111</text>
  <text class="s" x="400" y="105">POST acquire / heartbeat</text>
  <text class="s" x="400" y="130">POST release</text>
  <text class="s" x="400" y="155">GET leases, PUT policy</text>
  <text class="s" x="400" y="180">409 rejected, 410 lease lost</text>

  <text class="t" x="740" y="75">Plans</text>
  <text class="s" x="740" y="105">basic = 1 stream</text>
  <text class="s" x="740" y="130">fan = 2 streams</text>
  <text class="s" x="740" y="155">mega = 4 streams</text>

  <text class="t" x="400" y="285">LeaseService</text>
  <text class="s" x="400" y="315">plan limit + policy + clock</text>
  <text class="s" x="400" y="340">validates device ids</text>
  <text class="s" x="400" y="362">calls trait LeaseStore</text>

  <text class="t" x="740" y="285">Policy</text>
  <text class="s" x="740" y="315">reject_newest (409)</text>
  <text class="s" x="740" y="340">kick_oldest (evict min start)</text>

  <text class="t" x="160" y="465">RedisLeaseStore</text>
  <text class="s" x="160" y="495">4 Lua scripts, atomic per call</text>
  <text class="s" x="160" y="520">ZSET device -> expiry ms</text>
  <text class="s" x="160" y="545">HASH device -> started ms</text>
  <text class="e" x="160" y="565">redis-server :6111</text>

  <text class="t" x="580" y="465">MemoryLeaseStore</text>
  <text class="s" x="580" y="495">Mutex HashMap</text>
  <text class="s" x="580" y="520">same contract</text>
  <text class="s" x="580" y="545">unit + race tests</text>
</svg>
