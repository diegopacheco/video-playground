<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10" fill="none" stroke="#343a40" stroke-width="1.8"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #212529; }
      .title { font-size: 30px; font-weight: 700; }
      .head { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .box { stroke: #343a40; stroke-width: 2.2; }
      .line { stroke: #343a40; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #868e96; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" class="title">Release Day Herd - simulator and live waiting room</text>

  <g filter="url(#wobble)">
    <rect x="40" y="80" width="230" height="120" rx="14" fill="#e7f5ff" class="box"/>
    <rect x="40" y="250" width="230" height="140" rx="14" fill="#fff4e6" class="box"/>
    <rect x="40" y="440" width="230" height="130" rx="14" fill="#f3f0ff" class="box"/>
    <rect x="345" y="170" width="300" height="290" rx="14" fill="#ebfbee" class="box"/>
    <rect x="720" y="80" width="340" height="230" rx="14" fill="#fff9db" class="box"/>
    <rect x="720" y="360" width="340" height="210" rx="14" fill="#ffe3e3" class="box"/>
  </g>

  <text x="155" y="115" text-anchor="middle" class="head">React UI (Vite)</text>
  <text x="155" y="145" text-anchor="middle" class="body">scenario form, SVG load chart,</text>
  <text x="155" y="168" text-anchor="middle" class="body">comparison table, live room tab</text>

  <text x="155" y="285" text-anchor="middle" class="head">k6 live run</text>
  <text x="155" y="315" text-anchor="middle" class="body">1000 VUs join at once,</text>
  <text x="155" y="338" text-anchor="middle" class="body">poll position + ETA,</text>
  <text x="155" y="361" text-anchor="middle" class="body">play with token</text>

  <text x="155" y="475" text-anchor="middle" class="head">report binary</text>
  <text x="155" y="505" text-anchor="middle" class="body">runs all 5 strategies on</text>
  <text x="155" y="528" text-anchor="middle" class="body">1M viewers, prints the table</text>

  <text x="495" y="205" text-anchor="middle" class="head">axum server</text>
  <text x="495" y="240" text-anchor="middle" class="body">/api/compare  /api/simulate</text>
  <text x="495" y="265" text-anchor="middle" class="body">spawn_blocking + thread::scope</text>
  <text x="495" y="300" text-anchor="middle" class="body">/room/join  /room/status/{t}</text>
  <text x="495" y="325" text-anchor="middle" class="body">/room/play?token  /room/stats</text>
  <text x="495" y="360" text-anchor="middle" class="body">LiveRoom = AdmissionGate</text>
  <text x="495" y="385" text-anchor="middle" class="body">+ secret token per ticket</text>
  <text x="495" y="420" text-anchor="middle" class="body">Mutex, real clock</text>

  <text x="890" y="115" text-anchor="middle" class="head">Discrete-event engine</text>
  <text x="890" y="148" text-anchor="middle" class="body">BinaryHeap of (time us, client)</text>
  <text x="890" y="173" text-anchor="middle" class="body">SplitMix64 seed, 1M clients</text>
  <text x="890" y="206" text-anchor="middle" class="body">client: press, api, manifest, segment</text>
  <text x="890" y="231" text-anchor="middle" class="body">API + origin = token buckets</text>
  <text x="890" y="256" text-anchor="middle" class="body">CDN = 20 edges x 5 objects,</text>
  <text x="890" y="281" text-anchor="middle" class="body">miss goes to origin, no coalescing</text>

  <text x="890" y="395" text-anchor="middle" class="head">Strategy trait</text>
  <text x="890" y="428" text-anchor="middle" class="body">prewarm_cdn()  uses_waiting_room()</text>
  <text x="890" y="453" text-anchor="middle" class="body">retry_delay_ms(failures, rng)</text>
  <text x="890" y="488" text-anchor="middle" class="body">naive, jittered-backoff, cdn-prewarm,</text>
  <text x="890" y="513" text-anchor="middle" class="body">waiting-room, combined</text>
  <text x="890" y="548" text-anchor="middle" class="body">Recorder: 100 ms buckets, TTFF</text>

  <path d="M270,140 C310,150 320,210 343,230" class="line"/>
  <text x="300" y="168" class="body">/api</text>
  <path d="M270,320 C300,320 315,330 343,335" class="line"/>
  <text x="285" y="310" class="body">/room</text>
  <path d="M645,250 C680,230 690,200 718,195" class="line"/>
  <text x="665" y="272" class="body">simulate</text>
  <path d="M890,312 L890,358" class="dash"/>
  <path d="M270,505 C560,560 640,520 718,465" class="dash"/>
  <text x="430" y="550" class="body">same engine, no HTTP</text>
</svg>
