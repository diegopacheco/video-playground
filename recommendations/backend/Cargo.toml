[package]
name = "recs"
version = "0.1.0"
edition = "2024"

[lib]
name = "recs"
path = "src/lib.rs"

[[bin]]
name = "recs"
path = "src/main.rs"

[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-postgres = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
