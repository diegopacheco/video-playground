<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #2b2b2b; }
      .t { font-size: 24px; font-weight: 700; }
      .s { font-size: 18px; }
      .box { stroke: #2b2b2b; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #2b2b2b; stroke-width: 2.2; fill: none; marker-end: url(#head); filter: url(#wobble); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1100" height="560">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <marker id="head" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10" fill="none" stroke="#2b2b2b" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#fffdf7"/>

  <rect class="box" x="30" y="40" width="200" height="110" rx="14" fill="#ffe8a3"/>
  <text class="t" x="55" y="78">subs/*.ass</text>
  <text class="s" x="55" y="105">en-US pt-BR es-419 ja-JP</text>
  <text class="s" x="55" y="128">styles, pos, karaoke, signs</text>

  <rect class="box" x="300" y="30" width="360" height="250" rx="14" fill="#cfe8ff"/>
  <text class="t" x="320" y="66">Rust service (axum)</text>
  <text class="s" x="320" y="98">TrackSource trait -> FsTrackSource</text>
  <text class="s" x="320" y="124">SubtitleParser trait -> AssParser</text>
  <text class="s" x="320" y="150">overrides tokenizer (tags, \N, \p)</text>
  <text class="s" x="320" y="176">webvtt::convert + LossReport</text>
  <text class="s" x="320" y="202">hls: master + subtitle playlists</text>
  <text class="s" x="320" y="228">ServeDir /media (Range)</text>
  <text class="s" x="320" y="258">port 8106</text>

  <rect class="box" x="30" y="330" width="250" height="180" rx="14" fill="#d9f2d0"/>
  <text class="t" x="50" y="366">setup.sh</text>
  <text class="s" x="50" y="396">local ffmpeg: source.mp4, HLS fMP4</text>
  <text class="s" x="50" y="422">podman vp06-ffmpeg (libass):</text>
  <text class="s" x="50" y="448">ass filter -> burned/LOCALE.mp4</text>
  <text class="s" x="50" y="474">copies Noto fonts to media/</text>

  <rect class="box" x="330" y="360" width="220" height="120" rx="14" fill="#efe0ff"/>
  <text class="t" x="350" y="396">media/</text>
  <text class="s" x="350" y="424">source.mp4, burned/*.mp4</text>
  <text class="s" x="350" y="450">hls/*.m4s, fonts/</text>

  <rect class="box" x="740" y="30" width="330" height="480" rx="14" fill="#ffd9d9"/>
  <text class="t" x="760" y="66">React UI (Vite proxy, 5106)</text>
  <rect class="box" x="765" y="90" width="280" height="80" rx="10" fill="#ffffff"/>
  <text class="s" x="780" y="122">Native: video + track (VTT)</text>
  <text class="s" x="780" y="148">STYLE block injected as ::cue</text>
  <rect class="box" x="765" y="190" width="280" height="80" rx="10" fill="#ffffff"/>
  <text class="s" x="780" y="222">JASSUB: libass wasm worker</text>
  <text class="s" x="780" y="248">raw ASS + fonts on canvas</text>
  <rect class="box" x="765" y="290" width="280" height="80" rx="10" fill="#ffffff"/>
  <text class="s" x="780" y="322">Report: lossiness table</text>
  <text class="s" x="780" y="348">+ HLS master playlist</text>
  <rect class="box" x="765" y="390" width="280" height="90" rx="10" fill="#ffffff"/>
  <text class="s" x="780" y="422">Burned-in: plain video</text>
  <text class="s" x="780" y="448">pixels already rendered</text>

  <path class="arrow" d="M230,95 L295,95"/>
  <path class="arrow" d="M130,150 L130,325"/>
  <path class="arrow" d="M280,420 L325,420"/>
  <path class="arrow" d="M480,355 L480,285"/>
  <path class="arrow" d="M660,110 L760,128"/>
  <text class="s" x="672" y="100">/vtt</text>
  <path class="arrow" d="M660,180 L760,228"/>
  <text class="s" x="672" y="178">/ass</text>
  <path class="arrow" d="M550,435 L760,435"/>
  <text class="s" x="600" y="425">/media mp4</text>
  <path class="arrow" d="M660,250 L760,325"/>
  <text class="s" x="690" y="262">/hls</text>
</svg>
