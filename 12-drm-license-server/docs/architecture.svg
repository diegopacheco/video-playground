<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #222; }
      .t { font-size: 24px; font-weight: 700; }
      .s { font-size: 18px; }
      .l { font-size: 17px; fill: #333; }
    </style>
  </defs>
  <rect width="1100" height="660" fill="#fffdf8"/>
  <g filter="url(#wobble)" stroke="#444" stroke-width="2">
    <rect x="30" y="40" width="250" height="150" rx="14" fill="#fde2e4"/>
    <rect x="30" y="380" width="250" height="170" rx="14" fill="#fff1c1"/>
    <rect x="420" y="40" width="270" height="120" rx="14" fill="#d8f3dc"/>
    <rect x="420" y="230" width="270" height="140" rx="14" fill="#dbe7ff"/>
    <rect x="420" y="440" width="270" height="130" rx="14" fill="#e9dcff"/>
    <rect x="820" y="230" width="250" height="140" rx="14" fill="#ffe5cc"/>
    <rect x="820" y="440" width="250" height="130" rx="14" fill="#e0f4f6"/>
    <rect x="820" y="40" width="250" height="120" rx="14" fill="#f1f1f1" stroke-dasharray="8 6"/>
  </g>
  <text x="155" y="80" text-anchor="middle" class="t">React UI + dash.js</text>
  <text x="155" y="110" text-anchor="middle" class="s">scenario buttons</text>
  <text x="155" y="135" text-anchor="middle" class="s">EME Clear Key protectionData</text>
  <text x="155" y="160" text-anchor="middle" class="s">Bearer session token</text>

  <text x="155" y="420" text-anchor="middle" class="t">setup.sh (ffmpeg)</text>
  <text x="155" y="450" text-anchor="middle" class="s">testsrc2 + sine, H.264/AAC</text>
  <text x="155" y="475" text-anchor="middle" class="s">CMAF DASH, cenc-aes-ctr</text>
  <text x="155" y="500" text-anchor="middle" class="s">random key + kid</text>
  <text x="155" y="525" text-anchor="middle" class="s">MPD ContentProtection</text>

  <text x="555" y="80" text-anchor="middle" class="t">/api/session</text>
  <text x="555" y="110" text-anchor="middle" class="s">HS256 token: sub, ent, exp</text>
  <text x="555" y="135" text-anchor="middle" class="s">SessionSigner</text>

  <text x="555" y="270" text-anchor="middle" class="t">/api/license/clearkey</text>
  <text x="555" y="300" text-anchor="middle" class="s">LicenseService trait</text>
  <text x="555" y="325" text-anchor="middle" class="s">kids in, JWK set out</text>
  <text x="555" y="350" text-anchor="middle" class="s">entitlement check</text>

  <text x="555" y="480" text-anchor="middle" class="t">/media/exp/sig/clip/*</text>
  <text x="555" y="510" text-anchor="middle" class="s">UrlSigner HMAC(acl + exp)</text>
  <text x="555" y="535" text-anchor="middle" class="s">403 expired / bad_signature</text>

  <text x="945" y="270" text-anchor="middle" class="t">KeyStore trait</text>
  <text x="945" y="300" text-anchor="middle" class="s">MemoryKeyStore</text>
  <text x="945" y="325" text-anchor="middle" class="s">kid -> content, key</text>

  <text x="945" y="480" text-anchor="middle" class="t">media/clip</text>
  <text x="945" y="510" text-anchor="middle" class="s">stream.mpd, init, chunks</text>
  <text x="945" y="535" text-anchor="middle" class="s">encrypted samples only</text>

  <text x="945" y="85" text-anchor="middle" class="t">Widevine / FairPlay</text>
  <text x="945" y="115" text-anchor="middle" class="s">PlayReady: future impls</text>
  <text x="945" y="140" text-anchor="middle" class="s">of LicenseService</text>

  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M280,90 L418,90"/>
    <path d="M280,150 C350,200 360,280 418,295"/>
    <path d="M280,175 C330,330 350,480 418,500"/>
    <path d="M690,300 L818,300"/>
    <path d="M690,505 L818,505"/>
    <path d="M945,162 L945,228" stroke-dasharray="6 5"/>
    <path d="M200,550 C260,630 860,640 945,573"/>
  </g>
  <text x="300" y="80" class="l">1 login</text>
  <text x="300" y="230" class="l">3 POST kids</text>
  <text x="205" y="320" class="l">2 GET signed</text>
  <text x="710" y="290" class="l">lookup kid</text>
  <text x="710" y="495" class="l">read file</text>
  <text x="440" y="648" class="l">writes encrypted segments + drm.json</text>
</svg>
